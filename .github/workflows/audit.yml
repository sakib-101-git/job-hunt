name: Audit

# Weekly proof that the scores mean something (brief §8.4): the auditor model
# re-scores a sample of last week's matches, and the golden set is evaluated
# against the live models. The live evaluation's answers are kept as an
# artifact; committing them to eval/golden/llm_answers.jsonl updates what CI
# replays (docs/RUNBOOK.md).
on:
  schedule:
    - cron: "13 3 * * 0"
  workflow_dispatch:
    inputs:
      audit:
        description: Re-score last week's matches (needs the production database)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    name: Auditor
    if: vars.PIPELINE_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.audit)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AUDITOR_PROVIDER: ${{ vars.AUDITOR_PROVIDER }}
      AUDITOR_MODEL: ${{ vars.AUDITOR_MODEL }}
      AUDITOR_API_KEY: ${{ secrets.AUDITOR_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked --no-dev
      - run: uv run --no-sync jobhunt audit

  eval-live:
    name: Golden set on live models
    runs-on: ubuntu-latest
    # Free-tier per-minute token limits make ~170 extractions slow.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pipeline
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked --no-dev
      - name: Evaluate with live models and record their answers
        run: |
          if [ -z "$GEMINI_API_KEY$GROQ_API_KEY" ]; then
            echo "No LLM key is set; nothing to evaluate live."
            exit 0
          fi
          uv run --no-sync jobhunt eval --live --record --report "$RUNNER_TEMP/eval-report.md"
      - uses: actions/upload-artifact@v7
        with:
          name: golden-set-live
          path: |
            eval/golden/llm_answers.jsonl
            ${{ runner.temp }}/eval-report.md
          if-no-files-found: ignore
          retention-days: 30
