name: CI

on:
  pull_request:
    # `edited` re-checks the PR title and body when they change.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pipeline + scripts)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check ..
      - run: uv run ruff format --check ..
      - run: uv run mypy
      - run: uv run pytest --cov
      - run: uv run jobhunt validate-config
      - run: uv run jobhunt build-shared --check
      - name: Golden-set evaluation (recorded LLM answers)
        run: uv run jobhunt eval --check

  bot:
    name: Bot (Worker)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Bundle the Worker as deploy would
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

  shared:
    name: Repo rules and secrets
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/repo_guard.py tracked-files
      - run: python3 scripts/check_hardcoding.py
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-ai-attribution:
    name: No AI attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch push has an all-zero `before`; check only its head commit then.
          if [ -z "${BASE//0/}" ]; then range="-1 $HEAD"; else range="$BASE..$HEAD"; fi
          git log --format=%B $range | python3 scripts/repo_guard.py attribution
      - name: Check PR title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | python3 scripts/repo_guard.py attribution
