name: JobHunt

# Runs the scrape -> filter -> score -> Telegram pipeline in the cloud,
# so notifications arrive even when your PC is off.
#
# Schedule is in UTC. Bangladesh is UTC+6, so:
#   03:00 UTC = 09:00 (9 AM)  BDT
#   15:00 UTC = 21:00 (9 PM)  BDT
on:
  schedule:
    - cron: "0 3 * * *"    # 9 AM Bangladesh time
    - cron: "0 15 * * *"   # 9 PM Bangladesh time
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab

# Never let two cycles run at once (they'd double-notify).
concurrency:
  group: jobhunt
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Restore the dedup database from the previous run so the same job is
      # never notified twice. A fresh run_id key + the restore-keys prefix
      # means we always pull the most recent saved copy, then save a new one.
      - name: Restore job database
        uses: actions/cache/restore@v4
        with:
          path: data
          key: jobhunt-db-${{ github.run_id }}
          restore-keys: |
            jobhunt-db-

      - name: Run JobHunt cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
          IMAP_APP_PASSWORD: ${{ secrets.IMAP_APP_PASSWORD }}
          LOG_LEVEL: INFO
        run: python -m src.main

      # Persist the updated database even if the run partially failed, so
      # dedup state is never lost.
      - name: Save job database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: jobhunt-db-${{ github.run_id }}
