# User-facing career tracks shown in the Telegram onboarding.
# A user picks one or more tracks; a job is eligible for that user only if the
# job's domain(s) intersect the domains of the chosen tracks, or its normalized
# title matches one of the track's include_titles.
#
# - domains:        domain slugs from job_titles.yaml (all titles in those domains count)
# - include_titles: extra titles pulled from OTHER domains (e.g. language-specialist roles)
# - role_fit:       "primary" domains give full role-fit points; "adjacent" give partial
# This file is DATA. Code must load it; never copy tracks/titles into source code.
version: 1
tracks:
  - id: ai_ml
    label: "🤖 AI & Machine Learning"
    description: "ML/AI engineering, deep learning, LLMs/GenAI, RAG, agents, computer vision, NLP, speech, AI research"
    domains:
      primary: [ai-ml, emerging-ai, computer-vision, nlp-speech, search-recsys]
      adjacent: [data-science-analytics, robotics]
    include_titles:
      # Python family (owner's explicit example: AI users must also get Python roles)
      - "Python Developer"
      - "Python Software Engineer"
      - "Python Backend Engineer"
      - "Python API Engineer"
      - "Python Automation Engineer"
      - "Python Data Engineer"
      - "Python AI Engineer"
      - "Python Scientific Software Engineer"
      - "Django Developer"
      - "Flask Developer"
      - "FastAPI Developer"
      # R / scientific languages (owner's explicit example: R developer)
      - "R Developer"
      - "R Programmer"
      - "Julia Developer"
      - "MATLAB Software Developer"
      - "Statistical Programmer"
      - "Full-Stack AI Engineer"

  - id: data_science
    label: "📊 Data Science & Analytics"
    description: "Data scientist/analyst, BI, statistics, experimentation, quantitative analysis"
    domains:
      primary: [data-science-analytics]
      adjacent: [data-engineering, ai-ml, search-recsys]
    include_titles: ["R Developer", "R Programmer", "SQL Developer", "Python Data Engineer", "Power BI Developer"]

  - id: data_engineering
    label: "🛢️ Data Engineering & Databases"
    description: "Data pipelines, big data, streaming, warehouses, databases, DBA, storage, search infrastructure"
    domains:
      primary: [data-engineering, distributed-db-storage]
      adjacent: [cloud, data-science-analytics]
    include_titles: ["SQL Developer", "Python Data Engineer", "Scala Developer"]

  - id: cybersecurity
    label: "🔐 Cybersecurity"
    description: "AppSec, pentesting/offensive, SOC/defensive, cloud & network security, GRC (technical)"
    domains:
      primary: [cybersecurity]
      adjacent: [networking, devops-sre-infra, it-infrastructure]
    include_titles: ["Android Security Engineer", "Cloud Security Engineer", "Bash/Shell Automation Engineer"]

  - id: software_web
    label: "🌐 Software & Web Development"
    description: "Backend, frontend, full-stack, web, enterprise apps, language/framework specialists"
    domains:
      primary: [software-engineering, language-specialists]
      adjacent: [tech-product-ux, developer-tools, enterprise-identity-integration, fintech]
    include_titles: []

  - id: mobile_desktop
    label: "📱 Mobile & Desktop Apps"
    description: "Android, iOS, Flutter, React Native, cross-platform, desktop applications"
    domains:
      primary: [mobile-desktop]
      adjacent: [software-engineering]
    include_titles: ["Kotlin Developer", "Swift Developer", "Dart Developer", "Flutter Developer", "React Native Developer"]

  - id: cloud_devops
    label: "☁️ Cloud, DevOps & SRE"
    description: "Cloud engineering, Kubernetes, platform engineering, CI/CD, SRE, infrastructure automation"
    domains:
      primary: [cloud, devops-sre-infra]
      adjacent: [developer-tools, it-infrastructure, networking]
    include_titles: ["Go Developer", "Golang Engineer", "Golang Developer", "Bash/Shell Automation Engineer", "PowerShell Developer"]

  - id: qa_testing
    label: "🧪 QA, SQA & Testing"
    description: "Manual/automation QA, SDET, performance testing, verification"
    domains:
      primary: [qa-testing]
      adjacent: [software-engineering, developer-tools]
    include_titles: ["Software Development Engineer in Test (SDET)"]

  - id: networking_it
    label: "🖧 Networking & IT Infrastructure"
    description: "Network engineering, system administration, IT officer/executive roles, enterprise IT"
    domains:
      primary: [networking, it-infrastructure]
      adjacent: [cloud, devops-sre-infra, cybersecurity, support-solutions]
