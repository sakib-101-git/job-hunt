# Job-title taxonomy for the job-hunt bot.
# Section `domains` is a VERBATIM transcription of the owner's document
# "Complete CSE, Software, AI & IT Job Title Directory" (35 domains, 2,095 entries,
# 2,002 unique; a few titles intentionally appear in more than one domain).
# Section `additions` holds curated titles that the document lacked but that are
# common on Bangladeshi boards (BDJobs/LinkedIn BD) and for entry-level hiring.
# Section `non_cse_exclusions` lists titles that must NEVER be treated as CSE roles.
# This file is DATA. Code must load it; never copy titles into source code.
