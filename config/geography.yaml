# Words and places the location gate reads. Matching is whole-word and
# case-insensitive, except aliases of up to three capital letters ("US", "EU",
# "NA"), which match only in capitals so "join us" is not the United States.
# Bangladesh's own places are in locations.yaml.
version: 1

# A remote job counts as open to Bangladesh when an eligibility entry says one
# of these and names no other country or region.
worldwide_phrases:
  - worldwide
  - world wide
  - anywhere
  - anywhere in the world
  - work from anywhere
  - global
  - globally
  - any country
  - any location
  - all countries
  - international
  - every corner of the world

remote_words: [remote, remotely, wfh, work from home, home based, home-based, telecommute, distributed, fully remote]

# A description saying one of these limits who may apply, whatever the board's
# "Anywhere" tag says (We Work Remotely tags some US-only jobs "Anywhere in the
# World"). Such a job waits for the LLM to read the description.
restriction_phrases: [authorized to work in, authorised to work in, work authorization, work authorisation, right to work in, must reside in, must be located in, must be based in, you are based in, must live in, residents of, only hiring in, only open to candidates in, eligible to work in, located in the US, US-based candidates, legally able to work in]

# Working-hours requirements. Never a reason to reject (brief §6.5): they are
# shown as a warning, and an entry made only of them says nothing about where
# the job may be done.
timezone_markers: [time zone, timezone, timezones, hours overlap, overlap, CET, CEST, EST, EDT, PST, PDT, CST, MST, GMT, UTC, BST, IST, ET, PT, US hours, EST hours]

# Words that carry no place in an eligibility entry ("REMOTE (CET ±2h, overlap
# preferred)"). Digits and punctuation are ignored as well.
filler_words: [hours, hour, h, only, preferred, required, within, plus, minus, or, and, of, with, in, the, a, an, to, from, flexible]

# Region names. `includes_bangladesh` regions pass only when the policy
# accept_region_lists_containing_bd is on; the others never include it.
regions:
  - {name: APAC, aliases: [Asia Pacific, Asia-Pacific], includes_bangladesh: true}
  - {name: Asia, aliases: [South Asia], includes_bangladesh: true}
  - {name: SAARC, includes_bangladesh: true}
  - {name: EMEA, includes_bangladesh: false}
  - {name: Europe, aliases: [EU, European Union, Eurozone, Western Europe, Eastern Europe], includes_bangladesh: false}
  - {name: Americas, aliases: [North America, South America, Latin America, LATAM, Central America, AMER, NA], includes_bangladesh: false}
  - {name: Middle East, aliases: [MENA, GCC, Gulf], includes_bangladesh: false}
  - {name: Africa, includes_bangladesh: false}
  - {name: Oceania, aliases: [ANZ], includes_bangladesh: false}

