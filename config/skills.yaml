# Canonical skills. Skills from job descriptions, CVs and typed input are mapped to
# these ids through `name` and `aliases` (case-insensitive, whole-word), so
# "ReactJS", "React.js" and "React" all count as the same skill.
# Add a skill here, never in code. Ids are snake_case and never change once used.
# `ambiguous: true` marks skills whose names are ordinary words or letters ("R",
# "Unity", "Excel"): the rules-only extractor skips them, because a word in prose
# is not a skill; an LLM that names one, with the posting backing it, is trusted.
# `exact` lists spellings matched only as written, because in other cases they
# are ordinary words ("REST" the API style, not "the rest of the team").
version: 1

