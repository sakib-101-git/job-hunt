# Pipeline tunables. Sections are added as each pipeline stage lands.
version: 1

title_matching:
  # Weighted token similarity (0-1) a fuzzy match needs to count.
  min_similarity: 0.7
  # Listing words the candidate lacks but that appear in the candidate's domains (the
  # "Laravel" in "PHP Laravel Developer") count at this fraction of their weight.
  # Other words, including ones the taxonomy has never seen ("Civil"), count in full.
  known_extra_weight: 0.3
  # Other domains within this similarity of the best match become secondary domains.
  secondary_margin: 0.05
  max_secondary_domains: 3
  # Typo repair: a listing token this similar (0-100) to a taxonomy word is
  # replaced by that word. Shorter tokens are never repaired.
  spelling_min_ratio: 85
  spelling_min_length: 5

database:
  # Cloudflare D1 over its REST API (used by the pipeline on GitHub Actions).
  d1_api_base_url: https://api.cloudflare.com/client/v4
  request_timeout_seconds: 30
  # Retries for 429 and 5xx responses and network errors; Retry-After is honoured.
  max_retries: 4
  retry_base_delay_seconds: 1.0
  # D1 limits (docs/DECISIONS.md), checked before a request is sent.
  max_params_per_statement: 100
  max_statement_bytes: 100000

normalization:
  # Job description length kept in the database, and sent to the LLM.
  jd_max_chars_stored: 8000
  jd_max_chars_llm: 6000
  # Query parameters dropped from job URLs ("*" matches any ending).
  tracking_params: [utm_*, ref, refid, ref_id, trk, trkinfo, trackingid, gh_src, gh_jid, lever-source, source, src, fbclid, gclid, mc_cid, mc_eid, oga]
  # Company name endings ignored when deciding whether two listings are one job.
  company_suffixes: [ltd, limited, inc, incorporated, llc, plc, pvt, private, co, corp, corporation, gmbh, bv, sa, ag, pte, bd]
  # Upserts per database batch.
  store_batch_size: 50
  # A listing seen again unchanged has its last_seen_at refreshed at most this
  # often, so polling every 10 minutes doesn't rewrite every row (D1 free tier).
  last_seen_refresh_hours: 24

# Dates such as deadlines are judged in this time zone.
timezone: Asia/Dhaka

freshness:
  # A job is fresh when posted at most this many days ago.
  max_age_days: 10

location_policy:
  # Sources whose jobs are in Bangladesh unless they name a foreign place.
  bangladesh_boards: [bdjobs]
  # Remote job with no stated eligibility: decide from the description (false)
  # or accept as is (true).
  accept_unspecified_remote: false
  # Accept regions that contain Bangladesh but do not name it ("APAC", "Asia").
  accept_region_lists_containing_bd: false
  # Sources whose "Anywhere" tag is unreliable when the listing also names
  # countries or regions (the named places are the real limit): such jobs wait
  # for the description. Elsewhere each entry is an alternative office option.
  mixed_tags_need_facts: [weworkremotely]

seniority_gate:
  # A job asking for this many more years than the user has is never sent.
  max_years_gap: {student_intern: 2, fresh_grad: 3, junior: 3, mid: 4, senior: 99}
  # Title seniority signals (title_rules.yaml levels) never sent per user level.
  blocked_title_levels:
    student_intern: [mid, senior, lead_plus]
    fresh_grad: [senior, lead_plus]
    junior: [lead_plus]
    mid: []
    senior: []
  # Years of experience assumed for a level when the user gave none.
  default_years: {student_intern: 0, fresh_grad: 0, junior: 1, mid: 3, senior: 5}

cse_gate:
  # A title the taxonomy doesn't know goes to the LLM classifier only if it (or the
  # listing's tags) contains one of these; otherwise it is not a CSE role.
  tech_signals: [software, developer, engineer, engineering, engr, programmer, programming, coder, data, database, dba, IT, ICT, MIS, computer, CSE, technical, technology, tech, cloud, devops, SRE, security, cyber, cybersecurity, infosec, AI, ML, machine learning, deep learning, NLP, LLM, web, frontend, front-end, backend, back-end, full stack, full-stack, fullstack, mobile, android, iOS, app, application, network, networking, system, systems, sysadmin, QA, SQA, test, testing, tester, automation, platform, infrastructure, API, blockchain, web3, game, unity, embedded, firmware, IoT, robotics, analytics, BI, python, java, javascript, typescript, react, node, PHP, laravel, ".NET", "C#", "C++", golang, rust, flutter, kotlin, swift, SQL, linux, kubernetes, docker, AWS, azure, GCP, ERP, SAP, salesforce, odoo, CRM, UI, UX, digital, solutions, architect, scientist, research, lecturer, instructor]

# Scam and exploitation markers (brief §12). The rules-only extractor looks for
# them; scoring treats any of them as a hard gate.
red_flags: [training fee, registration fee, processing fee, pay to apply, application fee, security deposit, refundable deposit, unpaid, without salary, no salary, commission only, commission-based only, bond, service bond]

notifications:
  telegram_api_base_url: https://api.telegram.org
  request_timeout_seconds: 20
  # Telegram: about 30 messages a second overall and 1 a second per chat (Bot FAQ).
  # Stay a little under both.
  messages_per_second: 25
  per_chat_interval_seconds: 1.1
  # A failed send is retried on later runs up to this many attempts in total.
  max_attempts: 5
  # Retries within one send: 429 waits Retry-After, 5xx and network errors back off.
  retries_per_send: 3
  retry_backoff_seconds: 2.0
  # Extra matches beyond the user's per-cycle cap are listed in one message, up to this many.
  max_listed_extras: 10
  # An alert names at most this many missing skills, then "+N more".
  max_missing_skills_shown: 6
  # Digest users get their waiting matches once a day, at the first run after
  # this local time.
  digest_time: "09:00"
  # After setup, a new user gets at most this many of the best current matches.
  backfill_top_n: 10
  # A run claims the rows it sends for this long, so overlapping runs never send
  # a row twice; longer than one send stage can take.
  lease_minutes: 15

# Inline-button callback codes, shared with the bot (build-shared): each button
# sends "<code>:<match id>", at most 64 bytes.
callbacks:
  why: wy
  applied: ap
  save: sv
  hide: hd
  thumbs_up: up
  thumbs_down: dn
  reason: rs
  cv_ok: ck
  cv_edit: ce

# The Telegram bot (Worker). Every option list is shown in this order; labels
# are in locales/en.json.
bot:
  # The Worker path Telegram posts updates to (setWebhook in deploy.yml).
  webhook_path: /telegram
  # Updates (commands and button taps) a user may send per minute.
  updates_per_minute: 30
  max_pause_days: 90
  cv_max_bytes: 5000000
  # Rows shown by /saved and /applied.
  list_limit: 20
  # Typed skill lists are cut at this many skills of at most this many characters.
  max_skills: 50
  max_skill_length: 40
  experience_levels: [student_intern, fresh_grad, junior, mid, senior]
  locations: [bangladesh, remote]
  job_types: [full_time, internship, part_time, contract]
  min_score_options: [5, 6, 7, 8]
  quiet_hours_options:
    - {start: "22:00", end: "08:00"}
    - {start: "23:00", end: "07:00"}
    - {start: "00:00", end: "08:00"}
  # 👎 asks for one of these.
  feedback_reasons: [too_senior, wrong_location, not_my_field, skills_dont_fit, scam, other]
  defaults:
    min_score: 6
    delivery_mode: instant
    max_per_cycle: 5
    include_adjacent: true

# repository_dispatch events the bot sends to the pipeline (backfill, CV parsing,
# /digest). Needs the GITHUB_DISPATCH_TOKEN Worker secret.
github:
  api_base_url: https://api.github.com
  repository: sakib-101-git/job-hunt

retention:
  # Job descriptions are cleared this long after a job was last seen; its
  # extracted facts are kept.
  jd_text_days: 60

# Every successful pipeline run writes its time to this kv key; the Worker's
# hourly check alerts admins when it is older than max_age_minutes.
heartbeat:
  kv_key: last_successful_run
  max_age_minutes: 60
  # Set while an alert about a stalled pipeline is open, so admins hear once.
  alert_kv_key: heartbeat_alert

# Once-a-day housekeeping (expiring jobs, retention) runs at the first pipeline
# run of each local day; this kv key holds the day it last ran.
maintenance:
  kv_key: last_maintenance_day
