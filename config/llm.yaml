# LLM providers and the order they are tried in. Both speak the OpenAI chat
# completions API with strict JSON-schema output (checked 2026-10-18).
#
# Free-tier limits change and Gemini's are shown only in AI Studio for the key's
# project: the Gemini numbers below are conservative placeholders to check
# against https://aistudio.google.com/rate-limit once a key exists. Groq's are
# from its rate-limits page. A 429 always moves on to the next model.
version: 1

providers:
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    # Free-tier inputs may be used to improve Google's products: job text only,
    # never CVs (docs/PRIVACY.md, bot phase).
    trains_on_inputs: true
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    trains_on_inputs: false

# Tried in order. Limits: per minute (rpm, tpm) and per UTC day (rpd, tpd);
# null means no limit of that kind is known.
chain:
  - {provider: gemini, model: gemini-3.5-flash-lite, rpm: 10, tpm: 200000, rpd: 500, tpd: null, params: {reasoning_effort: low}}
  - {provider: gemini, model: gemini-3.8-flash, rpm: 5, tpm: 200000, rpd: 100, tpd: null, params: {reasoning_effort: low}}
  # Groq (checked 2026-10-19, console.groq.com/docs/reasoning): GPT-OSS takes
  # reasoning_effort low|medium|high and include_reasoning; Qwen 3.8 takes
  # reasoning_effort none to skip reasoning. Reasoning spends the output budget
  # (Qwen ran out of it and GPT-OSS 20B returned invalid JSON without these).
  - {provider: groq, model: openai/gpt-oss-120b, rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000, params: {reasoning_effort: low, include_reasoning: false}}
  - {provider: groq, model: qwen/qwen3.8-27b, rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000, params: {reasoning_effort: none}}
  - {provider: groq, model: openai/gpt-oss-20b, rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000, params: {reasoning_effort: low, include_reasoning: false}}

request:
  timeout_seconds: 90
  temperature: 0
  max_output_tokens: 2000
  # Keep this share of each daily limit unused, for retries and other jobs.
  daily_safety_margin: 0.05
  # Per-minute limits: wait at most this long for room before trying the next model.
  max_wait_seconds: 30

extraction:
  prompt: prompts/extraction.v3.md
  prompt_version: extraction.v3
  # Jobs extracted per run at most; the rest wait for the next run.
  max_jobs_per_run: 60
  # Grounding: an evidence quote must match the description at least this well (0-100).
  min_evidence_score: 90
  # Rough tokens per character, to budget a request before sending it.
  tokens_per_char: 0.3
  # Output tokens a request is budgeted at before it is sent (the answer's real
  # count replaces it afterwards); max_output_tokens stays the hard cap.
  expected_output_tokens: 900

title_classification:
  prompt: prompts/title_classification.v2.md
  prompt_version: titles.v2
  batch_size: 25

# CV parsing (brief §6.10). CV text goes only to providers with
# trains_on_inputs: false, after the user agrees in the bot.
cv:
  prompt: prompts/cv.v1.md
  prompt_version: cv.v1
  # PDFs longer than this are read up to here; text is cut at max_chars (kept
  # under one request on the smallest per-minute token limit in the chain).
  max_pages: 8
  max_chars: 15000
  # Less text than this means a scanned (image-only) PDF: nothing to read.
  min_chars: 200
  max_summary_chars: 300

# The independent auditor (brief §8.4, `jobhunt audit`, weekly in audit.yml).
# It re-scores a sample of recent matches from the posting and the user's
# settings (tracks, level, years, skills, locations; never a name or id), so it
# must run on a provider with trains_on_inputs: false. AUDITOR_PROVIDER and
# AUDITOR_MODEL (and AUDITOR_API_KEY, which replaces the provider's key)
# override the model below; the default is the largest free model from a
# provider other than the extractor's first choice.
audit:
  prompt: prompts/audit.v1.md
  prompt_version: audit.v1
  provider: groq
  model: openai/gpt-oss-120b
  days: 7
  # Every match scoring at least this is audited, plus this share of the rest.
  audit_all_from: 8.0
  sample_rest: 0.10
  max_per_run: 40
  # The auditor agrees when its score is within this of the system's.
  agree_within: 1.5
  # Weekly calibration watch over the same days' matches.
  max_strong_share: 0.25
  min_score_stdev: 0.75
  worst_shown: 5
