name = "jobhunt-bot"
main = "src/index.ts"
# Must not be newer than the workerd release bundled with the pinned wrangler.
compatibility_date = "2026-10-12"

# Secret values are set with `wrangler secret put <NAME>`; only names live here.
[secrets]
required = ["TELEGRAM_WEBHOOK_SECRET"]

# The database id is not committed; deploy supplies it (docs/DECISIONS.md).
# Local dev and tests run against a local D1 with the same migrations.
[[d1_databases]]
binding = "DB"
database_name = "jobhunt"
migrations_dir = "../migrations"
