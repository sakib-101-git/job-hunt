[project]
name = "jobhunt"
version = "2.0.0"
description = "JobHunt pipeline: fetch, classify, gate, extract, score and notify CSE jobs."
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx[http2]==0.28.1",
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
  "rapidfuzz==3.14.6",
]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[dependency-groups]
dev = [
  "hypothesis==6.170.1",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.1",
  "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "../scripts"]
mypy_path = "../scripts"

[tool.pytest.ini_options]
testpaths = ["tests", "../scripts/tests"]
pythonpath = ["../scripts"]
addopts = ["-q", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

[tool.coverage.run]
source = ["jobhunt"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
